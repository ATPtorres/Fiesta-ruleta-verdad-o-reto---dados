name: Android APK · Fiesta Mix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Tests + APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar JavaScript y reglas
        run: |
          node --check docs/game-utils.js
          node --check docs/prompts.js
          node --check docs/app.js
          node --test tests/game-utils.test.cjs

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK instalable
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FiestaMix-Android.apk
          ls -lh dist/FiestaMix-Android.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FiestaMix-Android-APK
          path: dist/FiestaMix-Android.apk
          if-no-files-found: error

      - name: Publicar APK en GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Fiesta Mix 1.0.0 · APK Android
          body: |
            Tres juegos offline: dados animados, ruleta personalizada y verdad o reto para adultos.
            Descarga FiestaMix-Android.apk e instálalo en Android 7.0 o superior.
            La APK es una compilación debug firmada automáticamente por GitHub Actions, para instalación manual.
          files: dist/FiestaMix-Android.apk
          overwrite_files: true
          make_latest: true
