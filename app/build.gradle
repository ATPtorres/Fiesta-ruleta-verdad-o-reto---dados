plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atptorres.fiestamix'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atptorres.fiestamix'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../docs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
